<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Skarbiec Smoka – moje wydatki</title>
<meta name="theme-color" content="#9c2616">
<meta name="apple-mobile-web-app-title" content="Skarbiec">
<meta name="description" content="Prosty tracker wydatków i oszczędności.">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Ma+Shan+Zheng&display=swap">
<style>
:root{
  --bg:#ecdcb8;--surface:#f6ead0;--text:#2b1a12;--muted:#6e5640;--line:#a98b5c;
  --accent:#9c2616;--accent-text:#fbf0d6;--bar:#b9892c;--danger:#9c2616;--hl:#9c2616;--gold:#b9892c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1210;--surface:#27191a;--text:#f0e1c0;--muted:#b9a27c;--line:#6a4a35;
    --accent:#d9a93f;--accent-text:#1b1210;--bar:#c4902f;--danger:#ff8a70;--hl:#e8bf5a;--gold:#d9a93f;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1210;--surface:#27191a;--text:#f0e1c0;--muted:#b9a27c;--line:#6a4a35;
  --accent:#d9a93f;--accent-text:#1b1210;--bar:#c4902f;--danger:#ff8a70;--hl:#e8bf5a;--gold:#d9a93f;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:"Cormorant Garamond","Palatino Linotype",Georgia,serif;font-size:1.1rem;line-height:1.4;font-variant-numeric:lining-nums;
  background:radial-gradient(circle at 15% 8%,rgba(255,255,255,.28),transparent 40%),radial-gradient(circle at 85% 92%,rgba(110,60,20,.18),transparent 45%),var(--bg);background-attachment:fixed}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
header{position:relative;text-align:center;margin-bottom:18px}
.glyph{font-family:"Ma Shan Zheng","Songti SC","Noto Serif SC",serif;font-size:2.6rem;line-height:1;color:var(--hl)}
h1{font-size:1.9rem;margin:2px 0 2px;letter-spacing:.02em;font-weight:700}
.sub{color:var(--muted);font-size:1rem;margin:0 0 4px}
.dragon{display:block;width:100%;max-width:340px;height:auto;margin:6px auto 0}
.seal{position:absolute;top:0;right:0;width:40px;height:40px;background:var(--accent);color:var(--accent-text);font-family:"Ma Shan Zheng","Songti SC",serif;font-size:1.6rem;display:flex;align-items:center;justify-content:center;border-radius:4px;transform:rotate(6deg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 18px;margin-bottom:18px;box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5px var(--line)}
.card h2{font-size:1.25rem;margin:0 0 4px;font-weight:700}
.total{font-size:2.5rem;font-weight:700;letter-spacing:-.01em;color:var(--hl);line-height:1.1}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
select,input,button{font:inherit;font-size:1rem;color:var(--text)}
select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);margin-bottom:10px;font-family:inherit}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{width:100%;padding:13px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:var(--accent-text);font-weight:700;font-family:inherit;font-size:1.1rem;letter-spacing:.03em;cursor:pointer}
.ghost{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;font-family:inherit;text-decoration:underline}
.cat{margin:12px 0}
.cat .row{margin-bottom:4px}
.track{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--bar)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item small{color:var(--muted);display:block;font-size:.95rem}
.amt{font-weight:700;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:12px 0;margin:0;font-style:italic}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month strong{font-size:1.3rem;text-transform:capitalize}
.month button{width:42px;height:42px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.3rem;font-family:inherit}
.err{color:var(--danger);font-size:.95rem;margin:-4px 0 8px;min-height:1em}
.inc{display:flex;gap:8px;align-items:center;margin-top:4px}
.inc input{margin:0}
.inc .btn{width:auto;padding:11px 18px}
.sumrow{display:flex;justify-content:space-between;gap:8px;color:var(--muted);margin:2px 0 14px}
.sumrow strong{color:var(--text)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-family:inherit;font-size:1.1rem;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.donut{display:block;width:100%;max-width:270px;height:auto;margin:6px auto 14px}
.leg{display:flex;align-items:center;gap:10px;padding:8px 0}
.leg+.leg{border-top:1px solid var(--line)}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.leg .nm{flex:1}
.note{color:var(--muted);font-size:.95rem;text-align:center;margin:0 0 4px}
</style>
</head>
<body>
<main>
  <header>
    <div class="seal" aria-hidden="true">財</div>
    <div class="glyph" aria-hidden="true">龍</div>
    <h1>Skarbiec Smoka</h1>
    <p class="sub">Zapisuj, ile monet i na jaką potrzebę uszło.</p>
    <svg class="dragon" viewBox="0 0 340 96" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 70c10-30 36-30 40-8s30 28 56 6 44-60 74-34 52 40 80 4" stroke="var(--gold)" stroke-width="9"/>
      <path d="M8 70c10-30 36-30 40-8s30 28 56 6 44-60 74-34 52 40 80 4" stroke="var(--surface)" stroke-width="2" stroke-dasharray="1 7" opacity=".8"/>
      <path d="M92 52l-4-12m36 -2l-2-12m50 20l6-11m38 28l8-9" stroke="var(--hl)" stroke-width="3"/>
      <path d="M288 40l14-10 20 4-2 12 8 6-18 6-14-6z" fill="var(--hl)" stroke="var(--hl)" stroke-width="2"/>
      <path d="M296 32l-6-14m12 15l2-15" stroke="var(--gold)" stroke-width="3"/>
      <path d="M322 46c10-2 14 8 6 14m-8-8c8 6 4 16-4 16" stroke="var(--gold)" stroke-width="2"/>
      <circle cx="302" cy="40" r="2.2" fill="var(--surface)" stroke="none"/>
      <path d="M30 20c6-6 14-6 18 0m180 -2c6-8 18-8 22 0m-120 6c5-5 12-5 16 0" stroke="var(--line)" stroke-width="2"/>
    </svg>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="exp" aria-selected="true">Wydatki</button>
    <button class="tab" role="tab" data-tab="sav" aria-selected="false">Oszczędności</button>
  </div>

  <div class="month">
    <button id="prev" aria-label="Poprzedni miesiąc">‹</button>
    <strong id="monthLabel"></strong>
    <button id="next" aria-label="Następny miesiąc">›</button>
  </div>

  <div id="tab-exp">
  <div class="card">
    <h2>Nowy wydatek</h2>
    <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Kwota (zł)" aria-label="Kwota w złotych">
    <select id="cat" aria-label="Potrzeba"></select>
    <input id="newcat" placeholder="Nazwa nowej potrzeby" hidden aria-label="Nowa potrzeba">
    <input id="note" placeholder="Za co? (opcjonalnie)" aria-label="Opis">
    <input id="date" type="date" aria-label="Data">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="add">Dodaj wydatek</button>
  </div>

  <div class="card">
    <div class="sub" style="margin:0">Zostało z wypłaty</div>
    <div class="total" id="left">—</div>
    <div class="track" style="margin:8px 0"><div class="fill" id="leftbar" style="width:0%"></div></div>
    <div class="sumrow"><span>Wypłata: <strong id="incomeShown">nie podano</strong></span><span>Wydano: <strong id="total">0,00 zł</strong></span></div>
    <div class="inc"><input id="income" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Wypłata na ten miesiąc (zł)" aria-label="Wypłata na ten miesiąc"><button class="btn" id="saveIncome">Zapisz</button></div>
    <div id="bycat"></div>
  </div>

  <div class="card">
    <h2>Historia</h2>
    <div id="list"></div>
  </div>
  </div>

  <div id="tab-sav" hidden>
    <div class="card">
      <h2>Oszczędności</h2>
      <p class="note" id="savnote"></p>
      <div id="donut"></div>
      <div id="legend"></div>
    </div>
  </div>
</main>

<script>
const NEW='__new__';
const DEFAULT_CATS=['Jedzenie','Transport','Rachunki','Mieszkanie','Zdrowie','Rozrywka','Ubrania','Inne'];
let state={expenses:[],cats:DEFAULT_CATS.slice(),income:{}};
let view=new Date();view.setDate(1);

function load(){
  try{
    const s=JSON.parse(localStorage.getItem('wydatki-v1')||'null');
    if(s&&Array.isArray(s.expenses)&&Array.isArray(s.cats)){state=s;if(!state.income||typeof state.income!=='object')state.income={};}
  }catch(e){}
}
function save(){try{localStorage.setItem('wydatki-v1',JSON.stringify(state))}catch(e){}}

const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł';
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthKey=()=>view.getFullYear()+'-'+String(view.getMonth()+1).padStart(2,'0');

function renderSelect(keep){
  const sel=$('cat');
  sel.innerHTML=state.cats.map(c=>`<option>${esc(c)}</option>`).join('')+`<option value="${NEW}">+ Nowa potrzeba…</option>`;
  if(keep&&state.cats.includes(keep))sel.value=keep;
}

function render(){
  const key=monthKey();
  $('monthLabel').textContent=view.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  const items=state.expenses.filter(e=>e.date.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const total=items.reduce((s,e)=>s+e.amount,0);
  $('total').textContent=fmt(total);
  const inc=state.income[key];
  $('incomeShown').textContent=inc>0?fmt(inc):'nie podano';
  const left=$('left');
  if(inc>0){const r=inc-total;left.textContent=fmt(r);left.style.color=r<0?'var(--danger)':'';$('leftbar').style.width=Math.min(100,total/inc*100)+'%';$('leftbar').style.background=r<0?'var(--danger)':'';}
  else{left.textContent='—';left.style.color='';$('leftbar').style.width='0%';}
  if(document.activeElement!==$('income'))$('income').value=inc>0?inc:'';
  const sums={};items.forEach(e=>sums[e.cat]=(sums[e.cat]||0)+e.amount);
  const rows=Object.entries(sums).sort((a,b)=>b[1]-a[1]);
  renderSavings(rows,total,inc);
  $('bycat').innerHTML=rows.length?rows.map(([c,v])=>`<div class="cat"><div class="row"><span>${esc(c)}</span><span class="amt">${fmt(v)} <small style="color:var(--muted);font-weight:500">(${Math.round(v/total*100)}%)</small></span></div><div class="track"><div class="fill" style="width:${v/total*100}%"></div></div></div>`).join(''):'<p class="empty">Brak wydatków w tym miesiącu.</p>';
  $('list').innerHTML=items.length?items.map(e=>`<div class="item"><div><span>${esc(e.cat)}</span><small>${esc(e.note?e.note+' · ':'')}${new Date(e.date+'T12:00').toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}</small></div><div><span class="amt">${fmt(e.amount)}</span><button class="ghost" data-del="${e.id}" aria-label="Usuń wydatek">Usuń</button></div></div>`).join(''):'<p class="empty">Dodaj pierwszy wydatek powyżej.</p>';
}

const PAL=['#9c2616','#c9803a','#7a4a8a','#35537a','#a07a2a','#b04a6a','#4f7f8a','#7a6a50','#5a4a9a'];
const SAVC='#3e7d5f';
function renderSavings(rows,total,inc){
  const saved=inc>0?inc-total:null;
  const parts=rows.map(([c,v],i)=>({name:c,val:v,color:PAL[i%PAL.length]}));
  if(saved>0)parts.push({name:'Oszczędności',val:saved,color:SAVC});
  const sum=parts.reduce((s,p)=>s+p.val,0);
  const R=80,C=2*Math.PI*R;
  let off=0,arcs='';
  if(sum>0){
    parts.forEach(p=>{const len=p.val/sum*C;const d=Math.max(len-(parts.length>1?2:0),.1);
      arcs+=`<circle cx="110" cy="110" r="${R}" fill="none" stroke="${p.color}" stroke-width="34" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}" transform="rotate(-90 110 110)"/>`;off+=len;});
  }else arcs=`<circle cx="110" cy="110" r="${R}" fill="none" stroke="var(--line)" stroke-width="34" opacity=".5"/>`;
  let label='Zaoszczędzono',amount='',col='var(--text)';
  if(saved===null){label='Podaj wypłatę';}
  else if(saved<0){label='Przekroczono o';amount=fmt(-saved);col='var(--danger)';}
  else{amount=fmt(saved);}
  const aria=saved===null?'Wykres wydatków':(saved<0?'Przekroczono wypłatę o '+fmt(-saved):'Zaoszczędzono '+fmt(saved));
  $('donut').innerHTML=`<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="${aria}">${arcs}<text x="110" y="${amount?102:116}" text-anchor="middle" font-size="14" fill="var(--muted)" font-family="inherit">${label}</text>${amount?`<text x="110" y="128" text-anchor="middle" font-size="${amount.length>10?17:21}" font-weight="700" fill="${col}" font-family="inherit">${amount}</text>`:''}</svg>`;
  $('legend').innerHTML=sum>0?parts.map(p=>`<div class="leg"><span class="sw" style="background:${p.color}"></span><span class="nm">${esc(p.name)}</span><span class="amt">${Math.round(p.val/sum*100)}% <small style="color:var(--muted);font-weight:500">(${fmt(p.val)})</small></span></div>`).join(''):'<p class="empty">Dodaj wydatki i wypłatę, żeby zobaczyć podział.</p>';
  $('savnote').textContent=sum===0?'':(saved>0?'Procenty liczone od wypłaty.':'Procenty liczone od sumy wydatków.');
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  $('tab-exp').hidden=b.dataset.tab!=='exp';
  $('tab-sav').hidden=b.dataset.tab!=='sav';
}));

$('cat').addEventListener('change',()=>{
  const n=$('cat').value===NEW;$('newcat').hidden=!n;if(n)$('newcat').focus();
});
$('add').addEventListener('click',()=>{
  const amount=parseFloat(String($('amount').value).replace(',','.'));
  let cat=$('cat').value;
  if(cat===NEW){
    cat=$('newcat').value.trim();
    if(!cat){$('err').textContent='Wpisz nazwę nowej potrzeby.';return}
    if(!state.cats.includes(cat))state.cats.push(cat);
  }
  if(!(amount>0)){$('err').textContent='Podaj kwotę większą od zera.';return}
  $('err').textContent='';
  const date=$('date').value||todayStr();
  state.expenses.push({id:Date.now(),amount:Math.round(amount*100)/100,cat,note:$('note').value.trim(),date});
  save();
  $('amount').value='';$('note').value='';$('newcat').value='';$('newcat').hidden=true;
  renderSelect(cat);
  view=new Date(date+'T12:00');view.setDate(1);
  render();
});
$('list').addEventListener('click',e=>{
  const id=e.target.dataset.del;if(!id)return;
  state.expenses=state.expenses.filter(x=>String(x.id)!==id);save();render();
});
$('prev').addEventListener('click',()=>{view.setMonth(view.getMonth()-1);render()});
$('next').addEventListener('click',()=>{view.setMonth(view.getMonth()+1);render()});
$('saveIncome').addEventListener('click',()=>{
  const key=monthKey();
  const v=parseFloat(String($('income').value).replace(',','.'));
  if(v>0)state.income[key]=Math.round(v*100)/100;else delete state.income[key];
  save();render();
});

load();
$('date').value=todayStr();
renderSelect();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});}
</script>
</body>
</html>
